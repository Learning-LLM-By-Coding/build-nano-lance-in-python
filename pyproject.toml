[project]
name = "nanolance"
version = "0.1.0"
description = "A tiny Lance-style columnar format and LanceDB-style query layer, built one tested day at a time."
readme = "README.md"
license = "MIT"
authors = [{ name = "Link" }]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
nanolance = "nanolance.cli:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.3",
]

[tool.uv]
required-version = ">=0.11.3"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, pyupgrade, bugbear.
select = ["E", "F", "I", "UP", "B"]
